# Configurações estáveis, que não variam entre ambientes: nome da aplicação, rotas,
# resiliência, actuator e logging. O que varia por ambiente (Redis, CORS, timeouts,
# OAuth2 e Eureka) fica nos arquivos *-env.

server:
  port: 9998

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: api-gateway-admin
  cloud:
    gateway:
      server:
        webflux:
          route-refresh-listener:
            enabled: false # desativa o refresh de rotas toda vez que chamar o eureka
          filter:
            local-response-cache:
              enabled: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: Retry # global retry resilience
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms # primeira tentativa
                  maxBackoff: 20ms # ultima tentativa
          globalcors: # cors global para todas as rotas (a origem permitida vem dos arquivos *-env)
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedHeaders: '*'
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
          routes:
            # invoice pertence ao billing, nao ao ordering - precisa vir antes
            # de ordering-route (mais especifico primeiro), senao /api/v1/orders/**
            # captura a requisicao e manda para o servico errado
            - id: billing-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/orders/{orderId}/invoice
                - Method=GET,OPTIONS
            - id: ordering-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/orders/**
              filters: # route circuit breaker resilience
                - name: CircuitBreaker
                  args:
                    name: ordering-route-cb
                    statusCodes:
                      - 502
                      - 504
                      - 500
            - id: customer-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/customers/**
                - Method=GET,OPTIONS
            - id: product-catalog-list-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products
                - Method=GET
              filters:
                - RemoveJsonAttributesResponseBody=shortDescription,mainImage,true # remove campos desnecessarios
                # esta rota vem ANTES da product-catalog-route (primeira que casa vence),
                # entao precisa do proprio rate limit - sem ele, a listagem escaparia do limite
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 200
                      requestedTokens: 1
                    key-resolver: "#{@rateLimitKeyResolver}"
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/categories/**,/api/v1/upload-requests/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - name: RequestRateLimiter # rate limit (token bucket no Redis), estoura = 429
                  args:
                    redis-rate-limiter:
                      replenishRate: 50 # tokens repostos por segundo (taxa sustentada)
                      burstCapacity: 200 # tamanho do bucket (pico maximo de uma vez)
                      requestedTokens: 1 # tokens gastos por requisição
                    key-resolver: "#{@rateLimitKeyResolver}" # bean que define a chave de contagem (ex: token usuário)
            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

eureka:
  client:
    registerWithEureka: false # não se registra como client
    fetchRegistry: true # busca os serviços dentro eureka

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,circuitbreakers
  endpoint:
    gateway:
      enabled: true

# circuit breaker configs customizado
resilience4j.circuitbreaker:
  instances:
    ordering-route-cb:
      slidingWindowSize: 8 # maximo de chamadas
      failureRateThreshold: 50 # abre o circuito
      minimumNumberOfCalls: 5 # minimo de chamadas para abrir
      permittedNumberOfCallsInHalfOpenState: 5 # chamadas permitidas em meio aberto, se sucesso fecha o circuit
      slidingWindowType: COUNT_BASED
      waitDurationInOpenState: 10s # tempo de circuito aberto
      maxWaitDurationInHalfOpenState: 30s # tempo meio aberto após o aberto
      registerHealthIndicator: true # indicador de saúde do circuto
